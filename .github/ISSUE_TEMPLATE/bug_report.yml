name: "🐞 Reportar un error"
description: Describe un error que hayas encontrado en la plataforma No estás solx
title: "[BUG] Escribe un título descriptivo aquí"
labels:
  - bug
assignees:
  - Marulix
  - ncarvajalc
projects:
  - Vicedecanatura-Asuntos-Estudiantiles/4
type: bug
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por ayudarnos a mejorar No estás solx!

        Proporciona toda la información posible para que podamos reproducir y corregir el problema rápidamente.
  - type: textarea
    id: descripcion-error
    attributes:
      label: "🧩 Descripción del error"
      description: Cuéntanos qué está fallando. Sé lo más claro y específico posible.
      placeholder: |
        Ejemplo: Al hacer clic en el botón "Enviar", no sucede nada.
    validations:
      required: true
  - type: textarea
    id: ubicacion
    attributes:
      label: "📍 ¿Dónde ocurre?"
      description: Indica en qué parte de la plataforma encontraste el error. Incluye la URL o sección específica si es posible.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: "🔁 Pasos para reproducirlo"
      description: Describe los pasos necesarios para ver el error.
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Observar que '...'
  - type: textarea
    id: evidencia
    attributes:
      label: "📸 Capturas o evidencia (opcional)"
      description: Agrega imágenes, videos o enlaces que nos ayuden a entender mejor el problema. No incluyas información sensible.
      placeholder: Arrastra y suelta archivos aquí o pega enlaces relevantes. No incluyas información sensible.
  - type: dropdown
    id: dispositivo
    attributes:
      label: "💻 Dispositivo"
      description: ¿Desde qué dispositivo reproduciste el error?
      options:
        - Computador
        - Celular
        - Tablet
        - Otro
    validations:
      required: true
  - type: dropdown
    id: navegador
    attributes:
      label: "🌐 Navegador"
      description: Selecciona todos los navegadores en los que viste el problema.
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Microsoft Edge
        - Opera
        - Otro
    validations:
      required: true
  - type: dropdown
    id: modo-incognito
    attributes:
      label: "🕶️ ¿Modo incógnito?"
      description: ¿Estabas usando una ventana en modo privado/incógnito?
      options:
        - Sí
        - No
    validations:
      required: true
